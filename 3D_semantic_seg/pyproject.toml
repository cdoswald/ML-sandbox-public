[tool.ruff]
exclude = ["**/_archive/*"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
strict = true

exclude = "_archive/"

[[tool.mypy.overrides]]
module = ["src.utils.utils_parquet"]
disable_error_code = ["attr-defined", "name-defined", "no-any-return", "no-untyped-call"]